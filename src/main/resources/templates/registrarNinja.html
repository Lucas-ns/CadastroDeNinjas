<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Ninja</title>
    <link rel="stylesheet" th:href="@{/css/registrar-ninja.style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Formulário de Cadastro de Ninja</h1>

    <form th:action="${ninja.id != null} ? @{/ninjas/ui/alterar/{id}(id=${ninja.id})} : @{/ninjas/ui/criar}"
          th:object="${ninja}"
          method="post">

        <input type="hidden" name="_method" value="put" th:if="${ninja.id != null}">

        <input type="hidden" th:field="*{id}">

        <label for="nome">Nome</label>
        <input type="text" th:field="*{nome}" id="nome" required>
        <br>

        <label for="email">Email</label>
        <input type="email" th:field="*{email}" id="email" required>
        <br>

        <label for="idade">Idade</label>
        <input type="number" th:field="*{idade}" id="idade" required>
        <br>

        <label for="imageUrl">Url da Imagem</label>
        <input type="text" th:field="*{imageUrl}" id="imageUrl">
        <br>

        <label for="rank">Rank</label>
        <input type="text" th:field="*{rank}" id="rank">
        <br>

        <label for="missoes">Escolha uma missão:</label>
        <select th:field="*{missao}" name="missoes" id="missoes">
            <option value="">Nenhuma missão</option>
            <option th:each="missao : ${missoes}"
                    th:value="${missao.id}"
                    th:text="|${missao.nome} - ${missao.dificuldade}|"></option>
        </select>
        <br>

        <button type="submit" th:text="${ninja.id != null} ? 'Atualizar' : 'Cadastrar'"></button>
        <a href="/ninjas/ui/listar">Voltar para lista</a>
    </form>
</body>
</html>
